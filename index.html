<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fff5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #ff6b6b;
            font-size: 24px;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            max-width: 90%;
            max-height: 80%;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>一个小惊喜💕💕</h1>
        <button class="btn" onclick="openBox()">点开里面</button>
    </div>

    <div id="box" class="modal" onclick="closeBox()">
        <img class="modal-content" src="https://bu.dusays.com/2026/05/24/6650b2ed65c71.png">
    </div>

    <script>
        function openBox() {
            document.getElementById('box').style.display = 'flex';
        }
        function closeBox() {
            document.getElementById('box').style.display = 'none';
        }
    </script>

</body>
</html>
